name: SVCE Smart No-Dues ERP CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Quality & Linting
  # ============================================================================
  lint:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Validate Server Syntax
        run: |
          node --check server/src/server.js
          node --check server/src/utils/logger.js
          node --check server/src/utils/sse.js
          node --check server/src/middleware/errorHandler.js

  # ============================================================================
  # 2. Automated Test Suite Execution
  # ============================================================================
  test:
    name: Backend Jest Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: svce_nodues
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Seed Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot svce_nodues < mysql_workbench_setup.sql

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Jest Test Suites
        working-directory: ./server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: svce_nodues
          JWT_SECRET: svce_nodues_secure_jwt_secret_min_32_chars_2026!
          CERT_HMAC_KEY: svce_nodues_secure_cert_hmac_key_min_32_chars!
          SESSION_SECRET: svce_nodues_secure_session_secret_min_32_chars!
          BACKUP_ENCRYPTION_KEY: svce_nodues_secure_backup_key_min_32_chars!
        run: npm test

  # ============================================================================
  # 3. Security Auditing & Vulnerability Scanning
  # ============================================================================
  security-audit:
    name: NPM Audit & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Audit Backend Dependencies
        working-directory: ./server
        run: npm audit --audit-level=high --omit=dev || true

      - name: Audit Frontend Dependencies
        working-directory: ./client
        run: npm audit --audit-level=high --omit=dev || true

  # ============================================================================
  # 4. Frontend Production Build
  # ============================================================================
  client-build:
    name: Build React 18 + Vite PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Vite PWA Production Bundle
        working-directory: ./client
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f client/dist/index.html
          test -f client/dist/sw.js
          test -f client/dist/manifest.webmanifest

  # ============================================================================
  # 5. Docker Container Image Build
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: svce-nodues-backend:test

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: svce-nodues-frontend:test
