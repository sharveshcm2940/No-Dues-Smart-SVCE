<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="100%">
  <!-- SVCE Lettering -->
  <g font-family="Inter, sans-serif" font-weight="800" fill="#1d4ed8">
    <!-- S -->
    <path d="M 12 36 C 12 20, 36 20, 36 29 C 36 43, 12 40, 12 55 C 12 66, 36 66, 36 51" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Stylized V with Leaves -->
    <g transform="translate(42, 20)">
      <!-- Left Blue Leaves -->
      <path d="M 16 42 Q 10 28, 4 20 Q 14 26, 18 36 Z" fill="#1d4ed8"/>
      <path d="M 18 34 Q 10 18, 2 8 Q 14 14, 20 26 Z" fill="#1d4ed8"/>
      <path d="M 20 26 Q 14 8, 8 0 Q 18 6, 22 18 Z" fill="#1d4ed8"/>
      <!-- Right Orange Leaves -->
      <path d="M 22 18 Q 26 6, 36 0 Q 30 8, 24 26 Z" fill="#f97316"/>
      <path d="M 20 26 Q 30 14, 42 8 Q 34 18, 22 34 Z" fill="#f97316"/>
      <!-- Bottom V Stem -->
      <path d="M 6 24 L 20 48 L 34 24" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- C -->
    <path d="M 124 26 C 104 26, 104 60, 124 60" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>

    <!-- E -->
    <path d="M 162 26 L 140 26 L 140 60 L 162 60 M 140 43 L 158 43" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orange Vertical Divider -->
  <line x1="176" y1="20" x2="176" y2="64" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- Right Text: Sri Venkateswara College of Engineering -->
  <g font-family="Inter, sans-serif" fill="#1d4ed8" font-size="13.5" font-weight="600">
    <text x="188" y="32">Sri Venkateswara</text>
    <text x="188" y="47">College of</text>
    <text x="188" y="62">Engineering</text>
  </g>

  <!-- Bottom Accreditation Text -->
  <g font-family="Inter, sans-serif" fill="#1e3a8a" font-size="9" font-weight="700" text-anchor="middle">
    <text x="160" y="84">Autonomous Institution, Affiliated to Anna University, Chennai</text>
    <text x="160" y="98">Approved by the AICTE, Accredited by NAAC</text>
  </g>
</svg>
