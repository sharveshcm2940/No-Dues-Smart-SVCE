version: '3.8'

services:
  # Node.js + Express Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: svce_nodues_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - nodues_db_data:/app/data
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=svce_nodues_secure_jwt_secret_2026

  # React + Vite + Nginx Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: svce_nodues_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  nodues_db_data:
