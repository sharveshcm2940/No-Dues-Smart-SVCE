version: '3.8'

# ==============================================================================
# SVCE Smart No-Dues ERP - Production Multi-Container Compose Architecture
# ==============================================================================
# Services:
#   1. db: MySQL 8 with persistent storage and connection pool tuning
#   2. backend: Express API with least-privilege non-root execution
#   3. frontend: React 18 + Vite PWA static delivery
#   4. reverse-proxy: Nginx with TLS 1.3, HSTS, Gzip, and SSE stream proxying
#
# Launch command:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ==============================================================================

services:
  # 1. MySQL 8 Database Service
  db:
    image: mysql:8.0
    container_name: svce_nodues_prod_db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --wait-timeout=28800
      --interactive-timeout=28800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-svce_nodues}
      MYSQL_USER: ${DB_USER:-svce_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nodues_prod_db_data:/var/lib/mysql
      - ./mysql_workbench_setup.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-svce_app}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - svce_prod_backend_net

  # 2. Node.js Express Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: svce_nodues_prod_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-svce_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-svce_nodues}
      - DB_CONNECTION_LIMIT=50
      - DB_MAX_IDLE=25
      - JWT_SECRET=${JWT_SECRET}
      - CERT_HMAC_KEY=${CERT_HMAC_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://nodues.svce.ac.in}
      - TRUST_PROXY=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - nodues_prod_uploads:/app/uploads
      - nodues_prod_backups:/app/backups
      - nodues_prod_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - svce_prod_backend_net
      - svce_prod_frontend_net

  # 3. React 18 + Vite Frontend Application Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: svce_nodues_prod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - svce_prod_frontend_net

  # 4. Production Nginx Reverse Proxy with TLS & HSTS
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: svce_nodues_reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - svce_prod_frontend_net

volumes:
  nodues_prod_db_data:
  nodues_prod_uploads:
  nodues_prod_backups:
  nodues_prod_logs:
  certbot_challenge:

networks:
  svce_prod_backend_net:
    internal: true
  svce_prod_frontend_net:
    driver: bridge
